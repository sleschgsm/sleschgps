<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SleschGPS Serwis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single workshop column — header, segmented switch, form or register; warranty card opens as a sheet */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d5dbe2;
  --fg:#16202b; --muted:#5a6878; --accent:#0b6e7a; --accent-fg:#ffffff;
  --signal:#c25e0c; --ok:#1f7a3f; --ok-bg:#e3f3e8; --bad:#a3322a; --bad-bg:#f8e4e2;
  --focus:#0b6e7a55;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --surface-2:#1e2833; --line:#2c3946;
  --fg:#e6ecf1; --muted:#93a2b1; --accent:#3fb3c0; --accent-fg:#06232a;
  --signal:#f0954a; --ok:#6fd496; --ok-bg:#163223; --bad:#f08a80; --bad-bg:#3a1c1a;
  --focus:#3fb3c066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --surface-2:#1e2833; --line:#2c3946;
  --fg:#e6ecf1; --muted:#93a2b1; --accent:#3fb3c0; --accent-fg:#06232a;
  --signal:#f0954a; --ok:#6fd496; --ok-bg:#163223; --bad:#f08a80; --bad-bg:#3a1c1a;
  --focus:#3fb3c066; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:600 14px var(--f-body);border:0;background:transparent;color:var(--muted);padding:10px;border-radius:7px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0002}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:400 16px var(--f-body);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;text-transform:none;letter-spacing:0}
input.mono{font-family:var(--f-mono);font-weight:500}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--accent)}
.snrow{display:flex;gap:8px;min-width:0}
.snrow input{flex:1;min-width:0}
.scanbtn{flex:none;padding:8px 12px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--accent);border-color:var(--accent)}
.scanbtn svg{width:20px;height:20px}
#scan-msg{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.scanner{position:fixed;inset:0;z-index:30;background:#000;display:grid;grid-template-rows:1fr auto}
.scanner video{width:100%;height:100%;object-fit:cover;display:block;grid-area:1/1}
.viewfinder{grid-area:1/1;align-self:center;justify-self:center;width:min(78vw,340px);height:min(46vw,200px);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax #0008;pointer-events:none}
.viewfinder::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#f0954a;box-shadow:0 0 8px #f0954a}
.viewfinder{position:relative}
.scanhint{grid-area:1/1;align-self:start;justify-self:center;margin-top:calc(24px + env(safe-area-inset-top,0px));color:#fff;font-weight:600;background:#0009;padding:6px 14px;border-radius:99px;font-size:14px}
.scanbar{display:flex;gap:10px;justify-content:center;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#000}
.scanbar .btn{background:#1e2833;color:#fff;border-color:#2c3946}
.money{position:relative}
.money input{padding-right:40px}
.money span{position:absolute;right:12px;bottom:11px;color:var(--muted);font-size:14px;text-transform:none;letter-spacing:0}

.btn{font:600 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:11px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{font-size:14px;padding:8px 12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--bad)}
.msg:empty{display:none}

.backup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.backup .msg{font-size:13px}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.row:hover{border-color:var(--accent)}
.row .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .amt{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .meta{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.row .meta .mono{font-family:var(--f-mono)}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;justify-self:end;align-self:center;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--f-display);font-size:19px;font-weight:600}

.sheet{position:fixed;inset:0;background:#0009;display:grid;place-items:end center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:640px){.sheet{place-items:center}}
.card{background:var(--surface);width:100%;max-width:520px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:640px){.card{border-radius:16px}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.code{font-family:var(--f-mono);font-weight:600;font-size:22px;letter-spacing:.06em;color:var(--signal)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qrbox{background:#fff;border-radius:12px;padding:14px;justify-self:center;border:1px solid var(--line)}
.qrbox canvas{display:block;width:220px;height:220px;image-rendering:pixelated}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dt{color:var(--muted);font-size:13px}
dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
dd.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.x{border:0;background:var(--surface-2);color:var(--fg);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.copy{border:0;background:none;color:var(--accent);font:600 13px var(--f-body);cursor:pointer;padding:0 0 0 8px}
@media (prefers-reduced-motion:no-preference){.card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-fg)" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.5 20 21l-8-4.2L4 21z"/></svg></div>
      <div><h1>SleschGPS Serwis</h1><div class="sub">Rejestr napraw nawigacji · Biłgoraj</div></div>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="seg" role="tablist">
    <button id="tab-new" role="tab" aria-selected="true">Nowa naprawa</button>
    <button id="tab-list" role="tab" aria-selected="false">Rejestr napraw</button>
  </div>

  <form class="panel" id="form" autocomplete="off">
    <h2 id="form-title">Nowa naprawa</h2>
    <div class="grid">
      <label class="full">Imię i nazwisko klienta<input id="f-klient" required placeholder="np. Jan Kowalski"></label>
      <label>Telefon<input id="f-tel" type="tel" inputmode="tel" required placeholder="np. 600 123 456"></label>
      <label>Data naprawy<input id="f-data" type="date" required></label>
      <label>Urządzenie<input id="f-urz" placeholder="np. TomTom GO 6250"></label>
      <label>Numer seryjny<span class="snrow"><input id="f-sn" class="mono" required placeholder="np. QE2193G01234"><button class="btn scanbtn" id="scan" type="button" hidden aria-label="Skanuj kod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>Skanuj</button></span><span class="msg" id="scan-msg"></span></label>
      <input id="scan-photo" type="file" accept="image/*" capture="environment" hidden>
      <label class="money">Kwota naprawy<input id="f-kwota" type="text" inputmode="decimal" required placeholder="0,00"><span>zł</span></label>
      <label>Okres gwarancji<select id="f-gw"><option value="1">1 miesiąc</option><option value="3" selected>3 miesiące</option><option value="6">6 miesięcy</option><option value="12">12 miesięcy</option><option value="24">24 miesiące</option></select></label>
      <label class="full">Zakres naprawy (opcjonalnie)<textarea id="f-opis" placeholder="np. wymiana baterii, aktualizacja map"></textarea></label>
    </div>
    <div class="actions">
      <button class="btn primary" id="save" type="submit">Zapisz i wygeneruj QR</button>
      <button class="btn" id="cancel-edit" type="button" hidden>Anuluj edycję</button>
      <span class="msg" id="form-msg"></span>
    </div>
  </form>

  <section id="register" hidden style="display:grid;gap:12px">
    <div class="backup">
      <span class="msg" id="backup-msg">Kopia zapasowa rejestru</span>
      <div class="actions">
        <button class="btn small" id="export" type="button">Eksportuj do Excela</button>
        <button class="btn small" id="import" type="button">Wczytaj z pliku</button>
        <input id="import-file" type="file" accept=".csv,text/csv" hidden>
      </div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Szukaj: nazwisko, telefon, nr seryjny, kod gwarancji"></div>
    <div class="msg" id="list-msg"></div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="scanner" id="scanner" hidden>
  <video id="scan-video" playsinline muted></video>
  <div class="viewfinder" aria-hidden="true"></div>
  <div class="scanhint">Nakieruj na kod QR lub kreskowy</div>
  <div class="scanbar">
    <button class="btn" id="scan-torch" type="button" hidden>Latarka</button>
    <button class="btn" id="scan-cancel" type="button">Anuluj</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="c-code">
    <div class="card-top">
      <div><div class="eyebrow">Karta gwarancyjna</div><div class="code" id="c-code"></div></div>
      <button class="x" id="c-close" aria-label="Zamknij">×</button>
    </div>
    <div class="qrbox"><canvas id="c-qr" width="220" height="220"></canvas></div>
    <div id="c-status" style="justify-self:center"></div>
    <dl id="c-dl"></dl>
    <div class="actions">
      <button class="btn primary" id="c-pdf">Drukuj kartę (PDF A6)</button>
      <button class="btn" id="c-card">Obrazek (PNG)</button>
      <button class="btn" id="c-qrpng">Sam QR</button>
    </div>
    <div class="actions">
      <button class="btn" id="c-edit">Edytuj</button>
      <button class="btn danger" id="c-del">Usuń</button>
      <span class="msg" id="c-msg"></span>
    </div>
  </div>
</div>

	getLength : function() {
		return this.data.length;

	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}

module.exports = QR8bitByte;

};
M["QRBitBuffer"]=function(module,exports){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

M["QRMath"]=function(module,exports){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {

		}
	
		return QRMath.EXP_TABLE[n];

	LOG_TABLE : new Array(256)

	QRMath.EXP_TABLE[i] = 1 << i;
}

	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;

M["QRPolynomial"]=function(module,exports){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];

	getLength : function() {
		return this.num.length;

	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);

		}

		}

		return new QRPolynomial(num, 0).mod(e);

	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

  function star(x, cx, cy, R){
    x.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? R*0.45 : R; x.lineTo(cx + rr*Math.cos(a), cy + rr*Math.sin(a)); }
    x.closePath(); x.fill();
  }
  // A6 (105 × 148 mm) at 300 dpi
  async function drawCard(r){
    try { await document.fonts.ready; } catch {}
    const W = 1240, H = 1748, M = 80, c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0,0,W,H);
    x.fillStyle = "#0b6e7a"; x.fillRect(0,0,W,210);
    x.fillStyle = "#ffffff";
    x.beginPath(); x.moveTo(125,52); x.lineTo(170,158); x.lineTo(125,134); x.lineTo(80,158); x.closePath(); x.fill();
    x.font = "700 74px 'Barlow Semi Condensed', 'Arial Narrow', sans-serif"; x.fillText("SleschGPS", 200, 122);
    x.font = "500 34px 'IBM Plex Sans', sans-serif"; x.fillText("Serwis nawigacji · Biłgoraj", 202, 170);
    x.fillStyle = "#5a6878"; x.font = "600 30px 'IBM Plex Sans', sans-serif"; x.fillText("KARTA GWARANCYJNA", M, 290);
    x.fillStyle = "#c25e0c"; x.font = "600 66px 'IBM Plex Mono', monospace"; x.fillText(r.kod, M, 368);
    drawQR(x, makeQR(qrText(r)), (W-540)/2, 395, 540);
    x.fillStyle = "#5a6878"; x.font = "400 26px 'IBM Plex Sans', sans-serif"; x.textAlign = "center";
    x.fillText("Kod gwarancji — zeskanuj, aby sprawdzić dane naprawy", W/2, 972); x.textAlign = "left";
    const end = warrantyEnd(r);
    const rows = [
      ["Klient", r.klient], ["Urządzenie", r.urzadzenie || "—"], ["Nr seryjny", r.nrSeryjny],
      ["Data naprawy", fmtDate(r.dataNaprawy)], ["Gwarancja", `${r.gwarancjaMies} mies. — do ${fmtDate(end)}`], ["Kwota", zl(r.kwota)]
    ];
    let y = 1062;
    x.strokeStyle = "#d5dbe2"; x.lineWidth = 2;
    rows.forEach(([k,v]) => {
      x.beginPath(); x.moveTo(M, y-44); x.lineTo(W-M, y-44); x.stroke();
      x.fillStyle = "#5a6878"; x.font = "500 32px 'IBM Plex Sans', sans-serif"; x.fillText(k, M, y);
      x.fillStyle = "#16202b"; x.font = "600 34px 'IBM Plex Sans', sans-serif";
      let t = String(v); while (x.measureText(t).width > 760 && t.length > 4) t = t.slice(0,-2) + "…";
      x.textAlign = "right"; x.fillText(t, W-M, y); x.textAlign = "left";
      y += 64;
    });
    // review band
    const top = 1440;
    x.fillStyle = "#e8f3f4"; x.fillRect(0, top, W, H-top);
    drawQR(x, makeQR(REVIEW_URL), M, top+30, 248);
    const tx = M + 248 + 44;
    x.fillStyle = "#0b6e7a"; x.font = "700 52px 'Barlow Semi Condensed', 'Arial Narrow', sans-serif"; x.fillText("Oceń nasz serwis", tx, top+92);
    x.fillStyle = "#e0a100"; for (let i = 0; i < 5; i++) star(x, tx + 22 + i*52, top+136, 22);
    x.fillStyle = "#16202b"; x.font = "500 30px 'IBM Plex Sans', sans-serif"; x.fillText("Zeskanuj kod i wystaw opinię w Google.", tx, top+208);
    x.fillStyle = "#5a6878"; x.font = "400 28px 'IBM Plex Sans', sans-serif"; x.fillText("Dziękujemy za zaufanie!", tx, top+252);
    return c;
  }
  // A4 page with the A6 card at true size in the top-left corner and a thin cut line
  function makePDF(jpeg, pxW, pxH){
    const mm = v => v * 72 / 25.4, pw = 595.28, ph = 841.89;
    const cw = mm(105), ch = mm(148), cx = mm(10), cy = ph - mm(10) - ch;
    const f = n => n.toFixed(2);
    const content = `q ${f(cw)} 0 0 ${f(ch)} ${f(cx)} ${f(cy)} cm /Im1 Do Q\n0.6 G 0.4 w [3 3] 0 d ${f(cx)} ${f(cy)} ${f(cw)} ${f(ch)} re S\n`;
    const enc = s => new TextEncoder().encode(s);
    const parts = [], offs = []; let len = 0;
    const push = p => { const u = typeof p === "string" ? enc(p) : p; parts.push(u); len += u.length; };
    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n".replace(/[\xE2\xE3\xCF\xD3]/g, "x"));
    const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body.forEach(push); push("\nendobj\n"); };
    obj(1, ["<< /Type /Catalog /Pages 2 0 R >>"]);
    obj(2, ["<< /Type /Pages /Kids [3 0 R] /Count 1 >>"]);
    obj(3, [`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im1 4 0 R >> >> /Contents 5 0 R >>`]);
    obj(4, [`<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`, jpeg, "\nendstream"]);
    obj(5, [`<< /Length ${enc(content).length} >>\nstream\n${content}endstream`]);
    const xref = len;
    push(`xref\n0 6\n0000000000 65535 f \n` + [1,2,3,4,5].map(n => String(offs[n]).padStart(10,"0") + " 00000 n \n").join(""));
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: "application/pdf" });
  }
  $("c-pdf").onclick = async () => {
    const r = current; if (!r) return;
    const c = await drawCard(r);
    const jpeg = new Uint8Array(await (await canvasBlob(c, "image/jpeg", 0.95)).arrayBuffer());
    saveBlob(makePDF(jpeg, c.width, c.height), `Gwarancja-${r.kod}.pdf`);
  };
  $("c-card").onclick = async () => {
    const r = current; if (!r) return;
    saveBlob(await canvasBlob(await drawCard(r), "image/png"), `Gwarancja-${r.kod}.png`);
  };
  $("c-qrpng").onclick = async () => {
    const r = current; if (!r) return;
    const c = document.createElement("canvas"); c.width = c.height = 800;
    drawQR(c.getContext("2d"), makeQR(qrText(r)), 0, 0, 800);
    saveBlob(await canvasBlob(c, "image/png"), `QR-${r.kod}.png`);
  };

  // ---------- serial number scanner ----------
  let detector = null, stream = null, scanning = false;
  async function initScanner(){
    if (!("BarcodeDetector" in window)) return;
    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      if (!formats.length) return;
      detector = new BarcodeDetector({ formats });
      $("scan").hidden = false;
    } catch {}
  }
  function useCode(raw){
    let v = String(raw || "").trim();
    const m = v.match(/(?:^|[\s;,|])(?:S\/?N|SN|SERIAL(?:\s*NO)?|NR\s*SER\w*)\s*[:=#]?\s*([A-Z0-9-]{5,})/i);
    if (m) v = m[1]; else if (v.includes("\n")) v = (v.split(/\r?\n/).find(l => l.trim()) || v).trim();
    $("f-sn").value = v.toUpperCase();
    $("scan-msg").textContent = "Zeskanowano: " + v.toUpperCase();
    try { navigator.vibrate?.(80); } catch {}
  }
  function stopScan(){
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    $("scan-video").srcObject = null;
    $("scanner").hidden = true;
  }
  async function loop(){
    if (!scanning) return;
    const v = $("scan-video");
    if (v.readyState >= 2) {
      try { const r = await detector.detect(v); if (r.length && scanning) { stopScan(); useCode(r[0].rawValue); return; } } catch {}
    }
    setTimeout(loop, 120);
  }
  $("scan").onclick = async () => {
    $("scan-msg").textContent = "";
    if (!navigator.mediaDevices?.getUserMedia) { $("scan-photo").click(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      if (e && e.name === "NotAllowedError") $("scan-msg").textContent = "Brak dostępu do aparatu. Możesz zrobić zdjęcie kodu.";
      $("scan-photo").click(); return;
    }
    const v = $("scan-video"); v.srcObject = stream; $("scanner").hidden = false; scanning = true;
    try { await v.play(); } catch {}
    const track = stream.getVideoTracks()[0];
    let torch = false;
    $("scan-torch").hidden = !(track.getCapabilities && track.getCapabilities().torch);
    $("scan-torch").onclick = () => { torch = !torch; track.applyConstraints({ advanced: [{ torch }] }).catch(() => {}); };
    loop();
  };
  $("scan-cancel").onclick = stopScan;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scanner").hidden) stopScan(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && scanning) stopScan(); });
  $("scan-photo").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || !detector) return;
    try {
      const bmp = await createImageBitmap(f); const r = await detector.detect(bmp);
      if (r.length) useCode(r[0].rawValue); else $("scan-msg").textContent = "Nie znaleziono kodu na zdjęciu. Spróbuj z bliska i przy dobrym świetle.";
    } catch { $("scan-msg").textContent = "Nie udało się odczytać zdjęcia."; }
  };
  initScanner();

  // ---------- start ----------
  renderList();
  (async () => {
    const lm = $("list-msg");
    store = MODE === "local" ? localStore() : await claudeStore();
    if (!store) {
      const why = MODE === "local" ? "Ta przeglądarka nie pozwala zapisywać danych (tryb prywatny?)." : "Rejestr jest dostępny tylko po zalogowaniu na koncie właściciela.";
      lm.textContent = why; $("form-msg").textContent = why; $("save").disabled = true;
      $("export").disabled = $("import").disabled = true; return;
    }
    $("backup-msg").textContent = store.backupNote;
    if (MODE !== "local") lm.textContent = "Wczytuję naprawy…";
    store.subscribe(a => { records = a; renderList(); }, t => { lm.textContent = t; });
  })();
})();
</script>
